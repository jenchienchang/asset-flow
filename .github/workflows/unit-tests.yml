name: Unit Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    uses: ./.github/workflows/xcode-build.yml
    with:
      operation: test
    permissions:
      contents: read

  python-tests:
    name: Python Script Tests
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python test dependencies
        run: uv sync --locked --only-group dev

      - name: Run Python tests
        run: uv run --locked --group dev python -m pytest
