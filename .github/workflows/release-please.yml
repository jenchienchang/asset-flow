name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: "Asia/Taipei"
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: simple

  format-release-pr:
    needs: release-please
    if: ${{ needs.release-please.outputs.prs_created == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}

      - name: Resolve SwiftLint release
        id: swiftlint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          METADATA_FILE=$(mktemp)
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/realm/SwiftLint/releases/latest" \
            --output "$METADATA_FILE"
          SWIFTLINT_VERSION=$(python3 -c \
            "import json,sys; print(json.load(open(sys.argv[1]))['tag_name'])" \
            "$METADATA_FILE")
          SWIFTLINT_ASSET_URL=$(python3 -c \
            "import json,sys; print(next(asset['browser_download_url'] for asset in json.load(open(sys.argv[1]))['assets'] if asset['name'] == 'swiftlint_linux_amd64.zip'))" \
            "$METADATA_FILE")
          SWIFTLINT_ASSET_DIGEST=$(python3 -c \
            "import json,sys; print(next(asset['digest'] for asset in json.load(open(sys.argv[1]))['assets'] if asset['name'] == 'swiftlint_linux_amd64.zip'))" \
            "$METADATA_FILE")
          if [[ "$SWIFTLINT_ASSET_DIGEST" != sha256:* ]]; then
            echo "SwiftLint release has no SHA-256 digest" >&2
            exit 1
          fi
          echo "version=$SWIFTLINT_VERSION" >> "$GITHUB_OUTPUT"
          echo "url=$SWIFTLINT_ASSET_URL" >> "$GITHUB_OUTPUT"
          echo "sha256=${SWIFTLINT_ASSET_DIGEST#sha256:}" >> "$GITHUB_OUTPUT"

      - name: Resolve swift-format bottle
        id: swift-format
        run: |
          METADATA_FILE=$(mktemp)
          curl --fail --silent --show-error --location \
            "https://formulae.brew.sh/api/formula/swift-format.json" \
            --output "$METADATA_FILE"
          SWIFT_FORMAT_VERSION=$(python3 -c \
            "import json,sys; print(json.load(open(sys.argv[1]))['versions']['stable'])" \
            "$METADATA_FILE")
          SWIFT_FORMAT_BOTTLE_URL=$(python3 -c \
            "import json,sys; print(json.load(open(sys.argv[1]))['bottle']['stable']['files']['x86_64_linux']['url'])" \
            "$METADATA_FILE")
          echo "version=$SWIFT_FORMAT_VERSION" >> "$GITHUB_OUTPUT"
          echo "url=$SWIFT_FORMAT_BOTTLE_URL" >> "$GITHUB_OUTPUT"

      - name: Cache lint tools
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: ~/lint-tools
          key: lint-tools-swiftlint-${{ steps.swiftlint.outputs.version }}-swift-format-${{ steps.swift-format.outputs.version }}

      - name: Install SwiftLint and swift-format
        if: steps.cache-tools.outputs.cache-hit != 'true'
        env:
          SWIFTLINT_ASSET_URL: ${{ steps.swiftlint.outputs.url }}
          SWIFTLINT_SHA256: ${{ steps.swiftlint.outputs.sha256 }}
          SWIFT_FORMAT_BOTTLE_URL: ${{ steps.swift-format.outputs.url }}
          SWIFT_FORMAT_VERSION: ${{ steps.swift-format.outputs.version }}
        run: |
          mkdir -p ~/lint-tools

          # SwiftLint: download pre-built binary from GitHub Releases
          curl --fail --silent --show-error --location \
            "$SWIFTLINT_ASSET_URL" \
            -o /tmp/swiftlint.zip
          echo "$SWIFTLINT_SHA256  /tmp/swiftlint.zip" | sha256sum --check -
          unzip -o /tmp/swiftlint.zip swiftlint -d ~/lint-tools/
          chmod +x ~/lint-tools/swiftlint

          # swift-format: download pre-built bottle from Homebrew registry
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer QQ==" \
            "$SWIFT_FORMAT_BOTTLE_URL" \
            -o /tmp/swift-format-bottle.tar.gz
          tar xzf /tmp/swift-format-bottle.tar.gz -C /tmp/
          cp /tmp/swift-format/${SWIFT_FORMAT_VERSION}/bin/swift-format ~/lint-tools/swift-format
          chmod +x ~/lint-tools/swift-format

      - name: Add tools to PATH
        run: echo "$HOME/lint-tools" >> $GITHUB_PATH

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run pre-commit auto-fix
        run: |
          pip install pre-commit
          pre-commit run --all-files || true

      - name: Commit formatting fixes
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style: format release files with pre-commit"
            git push
          fi

  deploy-docs:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --only-group docs

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy versioned docs
        run: |
          uv run mike deploy --push --update-aliases ${{ needs.release-please.outputs.tag_name }} latest
          uv run mike set-default --push latest

  build-and-upload:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Archive
        run: |
          xcodebuild archive \
            -project AssetFlow.xcodeproj \
            -scheme AssetFlow \
            -configuration Release \
            -archivePath build/AssetFlow.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            RELEASE_BUILD=YES

      - name: Copy .app from archive
        run: |
          cp -R build/AssetFlow.xcarchive/Products/Applications/AssetFlow.app build/AssetFlow.app

      - name: Zip .app
        run: |
          VERSION=$(cat version.txt | tr -d '[:space:]')
          ditto -c -k --sequesterRsrc --keepParent \
            build/AssetFlow.app \
            "build/AssetFlow-${VERSION}.zip"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: build/AssetFlow-*.zip
