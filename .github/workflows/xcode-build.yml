name: Xcode Build

on:
  workflow_call:
    inputs:
      operation:
        description: Xcode operation to run.
        required: true
        type: string
      package_release_artifact:
        description: Package and upload the app artifact for a GitHub release.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  xcode:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'

      - name: Validate operation
        if: ${{ inputs.operation != 'archive' && inputs.operation != 'test' }}
        env:
          XCODE_OPERATION: ${{ inputs.operation }}
        run: |
          echo "Unsupported Xcode operation: $XCODE_OPERATION" >&2
          exit 1

      - name: Verify project versions
        run: python3 scripts/release_version.py check

      - name: Archive
        if: ${{ inputs.operation == 'archive' }}
        run: |
          xcodebuild archive \
            -project AssetFlow.xcodeproj \
            -scheme AssetFlow \
            -configuration Release \
            -archivePath build/AssetFlow.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      - name: Verify archived app version
        if: ${{ inputs.operation == 'archive' }}
        run: python3 scripts/release_version.py archive build/AssetFlow.xcarchive

      - name: Run unit tests
        if: ${{ inputs.operation == 'test' }}
        run: |
          xcodebuild test \
            -project AssetFlow.xcodeproj \
            -scheme AssetFlow \
            -destination 'platform=macOS' \
            -resultBundlePath "$RUNNER_TEMP/AssetFlowTests.xcresult"

      - name: Report test failures
        if: ${{ failure() && inputs.operation == 'test' }}
        run: |
          result_bundle="$RUNNER_TEMP/AssetFlowTests.xcresult"
          if [ -d "$result_bundle" ]; then
            summary_path="$RUNNER_TEMP/AssetFlowTests-summary.json"
            report_path="$RUNNER_TEMP/AssetFlow-test-failures.json"
            xcrun xcresulttool get test-results summary --path "$result_bundle" > "$summary_path"
            python3 - "$summary_path" "$report_path" <<'PY'
          import json
          import sys
          from pathlib import Path

          summary = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          report = {
              "result": summary["result"],
              "failedTests": summary["failedTests"],
              "testFailures": summary["testFailures"],
          }
          report_json = json.dumps(report, ensure_ascii=False, indent=2) + "\n"
          Path(sys.argv[2]).write_text(report_json, encoding="utf-8")
          print(report_json, end="")
          PY
          else
            echo "No test result bundle was created."
          fi

      - name: Upload failed test report
        if: ${{ failure() && inputs.operation == 'test' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: AssetFlow-test-failures
          path: ${{ runner.temp }}/AssetFlow-test-failures.json
          if-no-files-found: warn

      - name: Copy .app from archive
        if: ${{ inputs.operation == 'archive' && inputs.package_release_artifact }}
        run: |
          cp -R build/AssetFlow.xcarchive/Products/Applications/AssetFlow.app build/AssetFlow.app

      - name: Zip .app
        if: ${{ inputs.operation == 'archive' && inputs.package_release_artifact }}
        run: |
          VERSION=$(python3 scripts/release_version.py version)
          ditto -c -k --sequesterRsrc --keepParent \
            build/AssetFlow.app \
            "build/AssetFlow-${VERSION}.zip"

      - name: Upload release build artifact
        if: ${{ inputs.operation == 'archive' && inputs.package_release_artifact }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: AssetFlow-release
          path: build/AssetFlow-*.zip
          if-no-files-found: error
