name: Xcode Build

on:
  workflow_call:
    inputs:
      operation:
        description: Xcode operation to run.
        required: true
        type: string
      package_release_artifact:
        description: Package and upload the app artifact for a GitHub release.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  xcode:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'

      - name: Validate operation
        if: ${{ inputs.operation != 'archive' && inputs.operation != 'test' }}
        env:
          XCODE_OPERATION: ${{ inputs.operation }}
        run: |
          echo "Unsupported Xcode operation: $XCODE_OPERATION" >&2
          exit 1

      - name: Archive
        if: ${{ inputs.operation == 'archive' }}
        run: |
          xcodebuild archive \
            -project AssetFlow.xcodeproj \
            -scheme AssetFlow \
            -configuration Release \
            -archivePath build/AssetFlow.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      - name: Run unit tests
        if: ${{ inputs.operation == 'test' }}
        run: |
          xcodebuild test \
            -project AssetFlow.xcodeproj \
            -scheme AssetFlow \
            -destination 'platform=macOS'

      - name: Copy .app from archive
        if: ${{ inputs.operation == 'archive' && inputs.package_release_artifact }}
        run: |
          cp -R build/AssetFlow.xcarchive/Products/Applications/AssetFlow.app build/AssetFlow.app

      - name: Zip .app
        if: ${{ inputs.operation == 'archive' && inputs.package_release_artifact }}
        run: |
          VERSION=$(cat version.txt | tr -d '[:space:]')
          ditto -c -k --sequesterRsrc --keepParent \
            build/AssetFlow.app \
            "build/AssetFlow-${VERSION}.zip"

      - name: Upload release build artifact
        if: ${{ inputs.operation == 'archive' && inputs.package_release_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: AssetFlow-release
          path: build/AssetFlow-*.zip
          if-no-files-found: error
